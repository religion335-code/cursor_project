[project]
name = "crypto-studio"
version = "0.1.0"
description = "Research, script, render, and optionally upload Traditional Chinese crypto briefing videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=6.1.0",
  "feedparser>=6.0.11",
  "google-api-python-client>=2.140.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.1",
  "Pillow>=10.4.0",
  "PyYAML>=6.0.2",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
crypto-studio = "crypto_studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
