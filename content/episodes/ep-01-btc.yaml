scenes:
  - heading: 第一集，從比特幣講起
    body: 這裡是時局筆記，我是呱霸。很多人一進幣圈就問會不會漲。這一集先不問價格。先問比特幣到底是什麼東西，你才知道自己在看什麼。
  - heading: 它不是一家公司的股票
    body: 比特幣沒有執行長、沒有客服電話、也不是某間公司發的積分。它是一套公開帳本：誰轉了多少、何時入帳，任何人都可以去核對。相信的是規則能不能被驗證，不是相信某個人會兌現承諾。
  - heading: 上限可以核對，不是口號
    body: 規則裡，比特幣大約只有兩千一百萬枚。這不自動等於稀有就會變貴。它只表示發行不是想印就印。價格仍受買賣雙方、流動性、監管與風險偏好影響。把上限直接聽成一定賺錢，是把規則誤當成報酬。
  - heading: 現貨、ETF、自己保管不一樣
    body: 你接觸比特幣的方式至少有三種。交易所現貨是帳戶記在平台；股票市場的現貨 ETF 是傳統帳戶裡的基金；自己保管是私鑰在你手上。方便程度與對手方風險不同。沒有一種叫做保證安全。
  - heading: 這不代表什麼
    body: 這不代表現在該買或該賣。也不代表聽懂比特幣，其他代幣就一樣。比特幣是這個市場裡最常被當成大型資產討論的一個，不是全部加密貨幣的總稱。下一集再講以太坊，那是另一套設計。
