scenes:
  - heading: 第二集，講以太坊
    body: 這裡是時局筆記，我是呱霸。上一集比特幣比較像大家共同維護的金條帳本。以太坊不一樣：帳本上還能跑程式。所以有人叫它世界電腦。名字很炫，先把它拆開。
  - heading: 智能合約不是法律合約
    body: 寫在以太坊上的程式，業界叫智能合約。它比較像自動販賣機：條件滿足就執行，沒有櫃檯人員替你改規則。好處是規則公開。壞處是程式寫錯、被鑽漏洞，錢也可能一去不回。程式沒有客服。
  - heading: Gas 是使用費，不是利息
    body: 要讓網路幫你記一筆、跑一段程式，需要付使用費，單位常叫 Gas。網路壅擠時費用會跳很高。這不是把幣放著就會生利息的意思。把手續費聽成穩健收益，會把工具費用當成投資報酬。
  - heading: 和比特幣不要混著背
    body: 比特幣主打簡單、可核對的價值移轉。以太坊主打在帳本上部署應用。兩個都可以在交易所看到價格，但不表示風險相同。合約應用、橋接、質押，每一層都多一個可能出錯的地方。
  - heading: 這不代表什麼
    body: 這不代表以太坊比較先進所以比較該買，也不代表比較複雜就比較能漲。下一集講索拉納，那又是另一組速度與穩定的取捨。先分清楚設計，再決定自己要不要碰。
  - heading: 免責聲明
    body: 本內容為時局觀察，由程式與 AI 輔助整理，可能有錯漏，不構成投資、法律或稅務建議。加密資產波動極大，可能損失全部本金。合約漏洞與使用費波動，都可能讓本金快速減少。
