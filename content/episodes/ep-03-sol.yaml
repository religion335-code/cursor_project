scenes:
  - heading: 第三集，講索拉納
    body: 這裡是時局筆記，我是呱霸。比特幣講可核對的移轉，以太坊講可程式的帳本。索拉納常見的賣點是快、費用低。快是設計目標，不是保證你會賺錢。
  - heading: 為什麼有人在意速度
    body: 若一筆交易要等很久、費用比轉帳金額還高，應用很難做起來。索拉納把高吞吐、低費用當成核心假設，所以去中心化交易、迷因幣、鏈上活動會看起來很熱鬧。熱鬧是使用量，不是安全證明。
  - heading: 中斷與權衡要講出來
    body: 索拉納主網過去有過停止出塊、效能不穩的紀錄。工程團隊會修，但使用者當下可能轉不出去。選這條鏈，等於接受「更快」和「有時會卡住」可以同時存在。這不是黑歷史八卦，是風險清單。
  - heading: 不要用快慢決定買不買
    body: 區塊鏈快，不表示代幣會漲。慢，也不表示比較誠實。三集看到這裡，只該留下一張對照表：比特幣偏簡單移轉，以太坊偏可程式，索拉納偏高速度。你要的是哪一種假設，自己寫下來。
  - heading: 入門三集先停在這裡
    body: 呱霸入門到第三集結束。還沒教你開槓桿、也沒有目標價。若要繼續看時局，我們會回到法案、資金與利率這些可核對的日曆。進場之前，先確定虧掉的錢不會影響生活。
  - heading: 免責聲明
    body: 本內容為時局觀察，由程式與 AI 輔助整理，可能有錯漏，不構成投資、法律或稅務建議。加密資產波動極大，可能損失全部本金。鏈暫停、應用故障與行情波動，都可能同時發生。
